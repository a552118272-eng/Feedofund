<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedofund | Crypto for Compassion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              display: ['Fredoka', 'sans-serif'],
            },
            colors: {
              feed: {
                green: '#96C67F',
                yellow: '#FCD863',
                orange: '#F4A261',
                cream: '#FFF9E6',
                dark: '#2D3748',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'walk-up': 'walkUp 8s linear infinite',
              'hover-sway': 'hoverSway 4s ease-in-out infinite',
              'waddle': 'waddle 1s ease-in-out infinite',
              'bounce-leg': 'bounceLeg 0.6s ease-in-out infinite',
              'cloud-drift': 'cloudDrift 20s linear infinite',
              'sun-spin': 'spin 12s linear infinite',
              'rise-1': 'rise 6s linear infinite',
              'rise-2': 'rise 8s linear infinite',
              'rise-3': 'rise 10s linear infinite',
              'marquee': 'marquee 25s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              hoverSway: {
                '0%, 100%': { transform: 'translateY(8px)' },
                '50%': { transform: 'translateY(-8px)' },
              },
              walkUp: {
                '0%': { transform: 'translateY(120%) translateX(-20%) scale(0.8)', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { transform: 'translateY(-20%) translateX(20%) scale(1.1)', opacity: '0' },
              },
              waddle: {
                '0%, 100%': { transform: 'rotate(-4deg)' },
                '50%': { transform: 'rotate(4deg)' },
              },
              bounceLeg: {
                '0%, 100%': { height: '20px' },
                '50%': { height: '15px' },
              },
              cloudDrift: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              rise: {
                '0%': { transform: 'translateY(400px) scale(0.5)', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { transform: 'translateY(-100px) scale(1.2)', opacity: '0' },
              },
              marquee: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FFF9E6; /* feed-cream */
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Custom utility for the character legs */
      .leg {
        transform-origin: top center;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
